name: Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...

  bash:
    name: Bash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # bd and code-review-graph at the versions setup.sh pins (bd checksum-verified).
      - run: bash scripts/ci/install-test-deps.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: bash scripts/ci/test.sh --bash-only
        env:
          # The optional tools are installed above, so a test that needs one must not skip.
          INTELLISENSE_REQUIRE_OPTIONAL_TOOLS: "1"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get install -y -qq shellcheck
      - run: bash scripts/ci/lint.sh

  # The single required check: passes only when every job above passed.
  tests:
    name: Tests
    if: always()
    needs: [go, bash, lint]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
